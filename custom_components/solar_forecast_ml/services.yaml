# ============================================================================
# Red Alert Services - Emergency Containment Procedures
# ============================================================================

emergency_outage_quarantine:
  name: "🚨 EMERGENCY: Outage Quarantine"
  description: >
    EMERGENCY SERVICE. Quarantines an inverter, plant, meter, or sensor outage
    period from learning and clean evaluation, blocks actual-value backfill for
    that period, and can invalidate contaminated learning layers. Use dry_run
    first. Live writes require explicit acknowledgement.
  fields:
    start_date:
      name: Start Date
      description: "First affected date in YYYY-MM-DD format."
      required: true
      example: "2026-06-20"
      selector:
        text:
    end_date:
      name: End Date
      description: "Last affected date in YYYY-MM-DD format. Defaults to start_date."
      required: false
      example: "2026-06-27"
      selector:
        text:
    start_hour:
      name: Start Hour
      description: "First affected hour on start_date. Defaults to 0."
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 23
          mode: box
    end_hour:
      name: End Hour
      description: "Last affected hour on end_date. Defaults to 23."
      required: false
      default: 23
      selector:
        number:
          min: 0
          max: 23
          mode: box
    reason:
      name: Reason
      description: "Emergency reason for audit and exclusion metadata."
      required: true
      default: lightning_damage
      selector:
        select:
          options:
            - label: "Lightning damage"
              value: "lightning_damage"
            - label: "Inverter failure"
              value: "inverter_failure"
            - label: "Sensor failure"
              value: "sensor_failure"
            - label: "Plant offline"
              value: "plant_offline"
            - label: "Meter failure"
              value: "meter_failure"
            - label: "Maintenance"
              value: "maintenance"
            - label: "Custom"
              value: "custom"
    custom_reason:
      name: Custom Reason
      description: "Optional custom reason when reason=custom."
      required: false
      selector:
        text:
    action:
      name: Action
      description: "Quarantine only, or also reset contaminated learned layers."
      required: false
      default: quarantine_only
      selector:
        select:
          options:
            - label: "Quarantine only"
              value: "quarantine_only"
            - label: "Quarantine and invalidate learning"
              value: "quarantine_and_invalidate_learning"
            - label: "Quarantine, invalidate, and retrain"
              value: "quarantine_invalidate_and_retrain"
    actual_policy:
      name: Actual Policy
      description: "Preserve existing actuals or null invalid zero/error actuals in the outage range."
      required: false
      default: preserve_actuals
      selector:
        select:
          options:
            - label: "Preserve actuals"
              value: "preserve_actuals"
            - label: "Null invalid actuals"
              value: "null_invalid_actuals"
    dry_run:
      name: Dry Run
      description: "Preview only. Defaults to true and does not write outage changes."
      required: false
      default: true
      selector:
        boolean:
    create_backup:
      name: Create Backup
      description: "Create a database backup before live write. Defaults to true."
      required: false
      default: true
      selector:
        boolean:
    acknowledge_emergency_risk:
      name: Acknowledge Emergency Risk
      description: >
        Must be true when dry_run is false. Confirms this emergency service writes
        directly to the SFML database and may reset learned model layers.
      required: false
      default: false
      selector:
        boolean:

run_all_day_end_tasks:
  name: "🌙 Run All Day-End Tasks"
  description: "Developer only or on advice."
  fields: {}

